  src: url("fonts/plex-latin-700.woff2") format("woff2"); }

:root {
  /* الحبر والأرضية — محايدات باردة مائلة قليلاً نحو الكحلي، لا رمادي ميت */
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-sunk: #f8fafc;
  --line: #e6ebf1;
  --line-strong: #d3dbe5;
  --text: #101c2e;
  --text-soft: #4d5f76;
  --text-mute: #8496ab;

  /* الهوية */
  --navy-900: #0d1b2e;
  --navy-800: #142742;
  --navy-700: #1c3557;
  --navy-600: #2c4d78;
  --navy-100: #e4ebf4;
  --navy-050: #f1f5fa;

  --gold-600: #8a6410;
  --gold-500: #b8891d;
  --gold-100: #fbf3de;

  /* درجات الخطورة — دلالية، منفصلة عن لون الهوية */
  --sev-critical: #b3261e;
  --sev-high: #c2620d;
  --sev-medium: #9a7209;
  --sev-low: #17693f;
  --sev-critical-bg: #fdeceb;
  --sev-high-bg: #fdf1e7;
  --sev-medium-bg: #fbf5e3;
  --sev-low-bg: #e9f5ee;

  --radius: 14px;
  --radius-sm: 9px;
  --radius-xs: 6px;

  /* ظلال ناعمة تحلّ محل الحدود الصلبة */
  --shadow-xs: 0 1px 2px rgba(16, 28, 46, .04), 0 0 0 1px rgba(16, 28, 46, .045);
  --shadow-sm: 0 2px 4px rgba(16, 28, 46, .05), 0 0 0 1px rgba(16, 28, 46, .05);
  --shadow: 0 6px 16px -6px rgba(16, 28, 46, .14), 0 0 0 1px rgba(16, 28, 46, .05);
  --shadow-lg: 0 24px 60px -18px rgba(13, 27, 46, .32);

  --font: "Plex Arabic", "IBM Plex Sans Arabic", "Noto Sans Arabic", "Dubai",
          "Segoe UI", system-ui, sans-serif;
  --font-num: "Plex Arabic", ui-monospace, "SFMono-Regular", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15.5px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "kern" 1;
}

/* الأرقام تصطف في الأعمدة */
.kpi-value, .stat b, td.num, .ch-value, .ch-axis, .ch-center-num,
input[type="number"], input[type="date"] { font-variant-numeric: tabular-nums; }

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.35; letter-spacing: -.011em; text-wrap: balance; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.02rem; }
h4 { font-size: .92rem; }
p { margin: 0 0 .6rem; }
a { color: var(--navy-600); }
button { font-family: inherit; }

/* ------------------------------ الهيكل ------------------------------ */
.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  background: var(--navy-900);
  color: #fff;
  padding: .7rem 1.4rem;
  display: flex;
  align-items: center;
  gap: 1.1rem;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 40;
}

.brand { display: flex; align-items: center; gap: .6rem; margin-inline-end: auto; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 8px; flex: none;
  background: var(--gold-500); color: var(--navy-900);
  display: grid; place-items: center;
  font-weight: 700; font-size: .98rem;
}
.brand-text b { display: block; font-size: 1rem; font-weight: 600; letter-spacing: -.01em; }
.brand-text span { display: block; font-size: .74rem; color: #93a9c4; line-height: 1.35; font-weight: 400; }

.nav { display: flex; gap: .2rem; flex-wrap: wrap; }
.nav button {
  background: transparent; border: 0; color: #a9c0da;
  padding: .44rem .8rem; border-radius: var(--radius-sm);
  font-size: .875rem; font-weight: 500; cursor: pointer;
  transition: background .15s, color .15s;
}
.nav button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.nav button.active { background: rgba(255, 255, 255, .13); color: #fff; font-weight: 600; }
.nav button:focus-visible, .btn:focus-visible, a:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible,
th.sortable:focus-visible { outline: 2px solid var(--gold-500); outline-offset: 2px; }

.toolbar { display: flex; gap: .35rem; flex-wrap: wrap; }

.main { flex: 1; padding: 1.6rem 1.4rem 2.4rem; max-width: 1360px; width: 100%; margin: 0 auto; }

/* ------------------------------ أزرار ------------------------------ */
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  padding: .46rem .9rem; border-radius: var(--radius-sm);
  font-size: .855rem; font-weight: 500; cursor: pointer;
  transition: background .15s, border-color .15s, box-shadow .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--navy-050); border-color: var(--navy-600); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--navy-700); border-color: var(--navy-700); color: #fff; }
.btn-primary:hover { background: var(--navy-800); border-color: var(--navy-800); }
.btn-gold { background: var(--gold-500); border-color: var(--gold-500); color: #fff; font-weight: 600; }
.btn-gold:hover { background: var(--gold-600); color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-soft); }
.btn-ghost:hover { background: var(--navy-100); color: var(--text); }
.btn-danger { color: var(--sev-critical); border-color: #f1c9c9; }
.btn-danger:hover { background: var(--sev-critical-bg); border-color: var(--sev-critical); }
.btn-sm { padding: .3rem .62rem; font-size: .8rem; }
.topbar .btn { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); color: #cfdcea; }
.topbar .btn:hover { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.28); color: #fff; }

/* ------------------------------ بطاقات ------------------------------ */
.card {
  background: var(--surface);
  border: 0;
  border-radius: var(--radius);
  box-shadow: var(--shadow-xs);
}
.card-head {
  padding: 1rem 1.15rem .2rem;
  display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
}
.card-head h3 { font-size: 1rem; font-weight: 600; }
.card-head .hint { font-size: .8rem; color: var(--text-mute); font-weight: 400; }
.card-body { padding: 1.15rem; }

.section-title {
  font-size: 1.16rem; font-weight: 600; margin: 2rem 0 .9rem;
  letter-spacing: -.014em;
}
.section-title:first-child { margin-top: 0; }

.grid { display: grid; gap: 1rem; }
.grid-kpi { grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); }

/* ------------------------------ KPI ------------------------------ */
.kpi {
  background: var(--surface); border: 0;
  border-radius: var(--radius); padding: 1.05rem 1.15rem 1.1rem;
  box-shadow: var(--shadow-xs);
  display: flex; flex-direction: column; gap: .12rem;
  position: relative; overflow: hidden;
}
/* شريط حالة رفيع أعلى البطاقة بدل حدّ جانبي سميك */
.kpi::before {
  content: ""; position: absolute; inset-block-start: 0; inset-inline: 0;
  height: 3px; background: var(--navy-600); opacity: .75;
}
.kpi-label { font-size: .82rem; color: var(--text-soft); font-weight: 500; }
.kpi-value {
  font-size: 2rem; font-weight: 600; line-height: 1.15;
  color: var(--navy-900); letter-spacing: -.028em; margin-top: .15rem;
}
.kpi-value small { font-size: .82rem; font-weight: 500; color: var(--text-mute); margin-inline-start: .25rem; letter-spacing: 0; }
.kpi-sub { font-size: .79rem; color: var(--text-mute); margin-top: .1rem; }
.kpi.is-alert::before { background: var(--sev-critical); }
.kpi.is-alert .kpi-value { color: var(--sev-critical); }
.kpi.is-good::before { background: var(--sev-low); }
.kpi.is-gold::before { background: var(--gold-500); }

/* ------------------------------ شارات ------------------------------ */
.badge {
  display: inline-flex; align-items: center; gap: .28rem;
  padding: .16rem .58rem; border-radius: 999px;
  font-size: .775rem; font-weight: 500; white-space: nowrap;
  border: 1px solid transparent;
}
.badge-gold { background: var(--gold-100); color: var(--gold-600); border-color: #edddb4; font-weight: 600; }
.badge-blue { background: var(--navy-100); color: var(--navy-700); border-color: #cfdcee; }
.badge-gray { background: #f0f3f7; color: var(--text-mute); border-color: var(--line); }
.badge-neutral { background: #f0f3f7; color: var(--text-soft); border-color: var(--line); }

.sev { display: inline-flex; align-items: center; gap: .35rem; padding: .16rem .58rem;
       border-radius: 999px; font-size: .775rem; font-weight: 500; white-space: nowrap; }
.sev::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.sev-حرجة   { background: var(--sev-critical-bg); color: var(--sev-critical); }
.sev-عالية  { background: var(--sev-high-bg); color: var(--sev-high); }
.sev-متوسطة { background: var(--sev-medium-bg); color: var(--sev-medium); }
.sev-منخفضة { background: var(--sev-low-bg); color: var(--sev-low); }

.chip {
  display: inline-block; padding: .14rem .52rem; border-radius: var(--radius-xs);
  background: var(--surface-sunk); border: 1px solid var(--line);
  font-size: .78rem; color: var(--text-soft); font-weight: 400;
}
.type-وقائي  { background: #eef6ff; color: #1d4ed8; border-color: #d5e4fb; }
.type-تشغيلي { background: #f0fbf3; color: #15803d; border-color: #cfead9; }
.type-تعاقدي { background: #fdf3e8; color: #b45309; border-color: #f3ddba; }

/* ------------------------------ جداول ------------------------------ */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: .875rem; min-width: 880px; }
table.data th, table.data td { padding: .78rem .85rem; text-align: right; vertical-align: middle; }
table.data tbody td { border-top: 1px solid var(--line); }
table.data thead th {
  background: var(--surface); color: var(--text-mute);
  font-size: .77rem; font-weight: 500; white-space: nowrap; letter-spacing: .02em;
  position: sticky; top: 0; z-index: 2;
  border-bottom: 1px solid var(--line-strong);
  padding-top: .55rem; padding-bottom: .55rem;
}
table.data thead th.sortable { cursor: pointer; user-select: none; }
table.data thead th.sortable:hover { color: var(--navy-700); }
table.data thead th .arrow { color: var(--gold-600); font-size: .68rem; }
table.data tbody tr { cursor: pointer; transition: background .12s; }
table.data tbody tr:hover { background: var(--surface-sunk); }
table.data td.num { white-space: nowrap; color: var(--text-soft); }
table.data .name { font-weight: 600; color: var(--text); }
table.data .muted { color: var(--text-mute); font-size: .8rem; }

/* ------------------------------ مرشحات ------------------------------ */
.filters { display: flex; gap: .5rem; flex-wrap: wrap; align-items: flex-start; }
.field { display: flex; flex-direction: column; gap: .22rem; flex: 1 1 130px; min-width: 130px; }
.field.grow { flex: 2 1 200px; }
.field label { font-size: .8rem; font-weight: 500; color: var(--text-soft); }
.field .req, .req { color: var(--sev-critical); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; direction: ltr; }
input, select, textarea {
  font-family: inherit; font-size: .875rem; color: var(--text);
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); padding: .52rem .68rem; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input::placeholder, textarea::placeholder { color: var(--text-mute); }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--navy-600);
  box-shadow: 0 0 0 3px rgba(44, 77, 120, .13);
}
input.invalid, select.invalid, textarea.invalid {
  border-color: var(--sev-critical); background: #fffafa;
}
textarea { resize: vertical; min-height: 62px; line-height: 1.6; }
.field-error { font-size: .79rem; color: var(--sev-critical); font-weight: 500; }
.field-hint { font-size: .785rem; color: var(--text-mute); }

/* ------------------------------ رسوم ------------------------------ */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart-donut { max-width: 210px; margin: 0 auto; }
.ch-label { font-size: 2.7px; fill: var(--text); font-weight: 500; font-family: var(--font); }
.ch-value { font-size: 2.7px; fill: var(--text-soft); font-weight: 600; font-family: var(--font);
            font-variant-numeric: tabular-nums; }
.ch-axis { font-size: 2.5px; fill: var(--text-mute); font-family: var(--font); }
.ch-track { fill: #eef1f5; }
.ch-grid { stroke: var(--line-soft); stroke-width: .22; }
.ch-trend { fill: none; stroke: var(--gold-500); stroke-width: .55; stroke-linejoin: round; }
.ch-dot { fill: var(--gold-500); }
.ch-center-num { font-size: 13px; font-weight: 600; fill: var(--navy-900); font-family: var(--font); letter-spacing: -.02em; }
.ch-center-lbl { font-size: 5px; fill: var(--text-mute); font-family: var(--font); }

.legend { display: flex; flex-wrap: wrap; gap: .45rem .9rem; margin-top: .6rem; }
.legend span { display: inline-flex; align-items: center; gap: .38rem; font-size: .82rem; color: var(--text-soft); }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* ------------------------------ التفاصيل ------------------------------ */
.detail-head {
  display: flex; gap: .8rem; align-items: flex-start; flex-wrap: wrap;
  margin-bottom: .9rem;
}
.detail-head h2 { font-size: 1.25rem; }
.detail-meta { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .35rem; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr)); gap: .6rem; }
.stat {
  background: var(--surface-sunk); border: 0;
  border-radius: var(--radius-sm); padding: .7rem .8rem;
}
.stat b { display: block; font-size: 1.18rem; font-weight: 600; color: var(--text); letter-spacing: -.018em; }
.stat span { font-size: .78rem; color: var(--text-mute); }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: .35rem .8rem; font-size: .85rem; }
.kv dt { color: var(--text-soft); font-weight: 700; font-size: .8rem; }
.kv dd { margin: 0; }

.issue {
  border: 0; border-radius: var(--radius-sm);
  padding: .8rem .95rem; background: var(--surface-sunk);
}
.issue + .issue { margin-top: .5rem; }
.issue-head { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin-bottom: .3rem; }
.issue p { margin: 0; font-size: .88rem; line-height: 1.7; }
.issue .effect { color: var(--text-mute); font-size: .82rem; margin-top: .3rem; }

.narrative {
  background: var(--surface); box-shadow: var(--shadow-xs);
  padding: 1.1rem 1.25rem; border-radius: var(--radius);
  font-size: .95rem; line-height: 1.95; color: var(--text-soft);
  max-width: 78ch;
}

/* ------------------------------ الحل ------------------------------ */
.solution { border-radius: var(--radius); overflow: hidden; }
.solution.approved { box-shadow: 0 1px 2px rgba(16,28,46,.04), 0 0 0 1px #e8d5a6; }
.solution.approved .solution-head { background: var(--gold-100); border-bottom-color: #edddb4; }
.solution-head {
  background: var(--surface-sunk); padding: .9rem 1.15rem;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
}
.diagnosis {
  background: var(--surface-sunk); border: 0;
  border-inline-start: 2px solid var(--navy-600);
  border-radius: var(--radius-xs); padding: .9rem 1.05rem;
  font-size: .93rem; line-height: 1.9;
}

.rec {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .9rem 1rem; background: var(--surface);
  border-inline-start: 3px solid var(--navy-600);
}
.rec + .rec { margin-top: .55rem; }
.rec[data-priority="1"] { border-inline-start-color: var(--sev-critical); }
.rec[data-priority="2"] { border-inline-start-color: var(--sev-high); }
.rec[data-priority="3"] { border-inline-start-color: var(--sev-medium); }
.rec-head { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin-bottom: .35rem; }
.rec-prio {
  width: 22px; height: 22px; border-radius: var(--radius-xs); flex: none;
  background: var(--navy-800); color: #fff;
  display: grid; place-items: center; font-size: .76rem; font-weight: 600;
}
.rec-action { font-size: .93rem; font-weight: 500; line-height: 1.65; margin-bottom: .5rem; }
.rec-foot { display: flex; gap: .3rem 1.1rem; flex-wrap: wrap; font-size: .8rem; color: var(--text-mute); }
.rec-foot b { color: var(--text-soft); font-weight: 500; }

.auto-flow {
  display: flex; align-items: stretch; gap: 0; flex-wrap: wrap;
  border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden;
}
.auto + .auto { margin-top: .55rem; }
.auto-name {
  font-size: .9rem; font-weight: 600; margin-bottom: .45rem;
  display: flex; align-items: center; gap: .45rem; flex-wrap: wrap;
}
.flow-step { flex: 1 1 160px; padding: .65rem .8rem; background: var(--surface); position: relative; }
.flow-step + .flow-step { border-inline-start: 1px solid var(--line-soft); }
.flow-step small { display: block; font-size: .72rem; font-weight: 500; color: var(--text-mute);
                   letter-spacing: .03em; margin-bottom: .18rem; }
.flow-step span { font-size: .845rem; line-height: 1.6; }
.flow-step.trigger { background: var(--surface-sunk); }
.flow-step.action { background: #f5fbf7; }

.kpi-row {
  display: flex; align-items: center; justify-content: space-between; gap: .8rem;
  padding: .68rem .85rem; border: 0;
  border-radius: var(--radius-sm); background: var(--surface-sunk);
  font-size: .88rem;
}
.kpi-row + .kpi-row { margin-top: .45rem; }

   * قواعد الموضوع تُفلتر بالفئة: لا تُطبَّق قاعدة موضوع خارج الطبقة الفاشلة.
   * (مثال: ذكر «سلسلة التبريد» في سرد فعالية تخطيطية لا يجعل الحل حلَّ تبريد.)
   * الترتيب: مواضيع الفئة الرئيسية أولاً، ثم مواضيع فئة قالب المزج.
   */
  function matchTopics(ev, primaryKey, blendKey) {
    var t = allText(ev);
    var hit = TOPIC_RULES.filter(function (r) { return r.re.test(t); });
    var main = hit.filter(function (r) { return r.cats.indexOf(primaryKey) !== -1; });
    var blended = blendKey
      ? hit.filter(function (r) {
          return r.cats.indexOf(blendKey) !== -1 && main.indexOf(r) === -1;
        })
      : [];
    return main.concat(blended);
  }

  var PATTERN_OVERLAY = {

      theme: 'redundancy',

      timeline_ar: '30 يوماً',
      expected_impact_ar: 'ما تعطّل هنا أتلف ' + f.wastedT + ' كغ بكلفة ' + f.costT + ' د.إ؛ البديل الجاهز يحصر الأثر في دقائق' }; },
    early_decision: function (f) { return {
      theme: 'staged_decision',

      action_ar: 'إدخال نقطة قطع (Cut-off) ونقاط مراجعة متدرجة قبل إقفال الإنتاج، بحيث لا تدخل الكمية ' +
                 'كاملة (' + f.deliveredT + ' كغ) الإنتاج قبل معرفة الواقع',

      timeline_ar: 'فوري',

    data_blind: function (f) { return {

      type: 'تشغيلي',

      expected_impact_ar: 'الارتجال وقت الأزمة يُستبدل بخطوة أولى معروفة سلفاً' }; }

  var SPOF_TARGETS = [

    { re: /مولد|وحدة التبريد الميدانية/, label: 'مولد التبريد الميداني' },
    { re: /منصة الاستلام الوحيدة|ازدحام منصة/, label: 'منصة الاستلام الوحيدة' },
    { re: /شاحنة|النقل المبرد|مبردة/, label: 'الشاحنة المبردة الوحيدة' },
    { re: /مصدر استيراد وحيد|جمارك|مستوردة/, label: 'مصدر الاستيراد الوحيد' },
    { re: /مورّد|مورد|اعتذر/, label: 'المورد الأساسي' }
  ];

  function spofTarget(ev) {
    var t = allText(ev);
    for (var i = 0; i < SPOF_TARGETS.length; i++) {
      if (SPOF_TARGETS[i].re.test(t)) return SPOF_TARGETS[i].label;
    }
    return 'المورد الوحيد في هذه الطبقة';
  }

  /* ================================================================== *
   * أدوات تجميع: منع التكرار وضمان مزيج الأنواع
   * ================================================================== */
  function pushUnique(list, item, keyFn) {
    if (!item) return;
    var k = keyFn(item);
    for (var i = 0; i < list.length; i++) if (keyFn(list[i]) === k) return;
    list.push(item);
  }

  function recKey(r) { return r.theme || (r.action_ar || '').slice(0, 45); }
  function autoKey(a) { return a.name_ar; }

  /** ضمان القاعدة 4: مزيج الأنواع (وقائي/تشغيلي/تعاقدي) قدر الإمكان */
  function ensureTypeMix(recs, pool) {
    if (recs.length < 3) return recs;
    var types = recs.map(function (r) { return r.type; });
    var unique = types.filter(function (t, i) { return types.indexOf(t) === i; });
    if (unique.length >= 2) return recs;
    // كل التوصيات من نوع واحد: استبدل الثالثة بأول بديل مختلف النوع
    for (var i = 0; i < pool.length; i++) {
      if (pool[i].type !== recs[0].type && recKey(pool[i]) !== recKey(recs[0]) && recKey(pool[i]) !== recKey(recs[1])) {
        recs[2] = pool[i];
        break;
      }
    }
    return recs;
  }

  /* ================================================================== *
   * 5) توليد الحل
   * ================================================================== */
  function generate(ev, goldenEvents) {
    var cls = classify(ev);
    var pattern = detectPattern(ev, cls);
    var severity = assessSeverity(ev);
    var templates = pickTemplates(ev, cls, pattern, goldenEvents || []);
    var f = facts(ev);

    var moduleName = L.MODULE_FOR_CATEGORY[cls.primary.key] || 'التنبؤ والتخطيط';
    var book = PLAYBOOKS[cls.primary.key] || PLAYBOOKS.planning;
    var blendKey = templates.blend ? templates.blend.profile.category : null;
    var blendBook = blendKey ? PLAYBOOKS[blendKey] : null;
    var topics = matchTopics(ev, cls.primary.key, blendKey);

    /* ---- التوصيات: موضوع (1) ← نمط الفشل (2) ← قالب الفئة ← قالب المزج ---- */
    var pool = [];
    topics.forEach(function (t) {
      var r = t.rec(f);
      r.theme = t.theme;
      pushUnique(pool, r, recKey);
    });
    pushUnique(pool, PATTERN_OVERLAY[pattern.key](f, spofTarget(ev)), recKey);
    book.recs.forEach(function (fn) { pushUnique(pool, fn(f), recKey); });
    if (blendBook) blendBook.recs.forEach(function (fn) { pushUnique(pool, fn(f), recKey); });

    var recs = pool.slice(0, 3);
    if (blendBook && recs.length === 3) {
      // ضمان حضور منطق المزج: آخر توصية تأتي من طبقة القالب الثاني
      var blendRec = blendBook.recs[0](f);
      var already = recs.some(function (r) { return recKey(r) === recKey(blendRec); });
      if (!already) recs[2] = blendRec;
    }
    recs = ensureTypeMix(recs, pool);
    recs = recs.map(function (r, i) {
      return {
        priority: i + 1, type: r.type, action_ar: r.action_ar,
        owner_ar: r.owner_ar, timeline_ar: r.timeline_ar, expected_impact_ar: r.expected_impact_ar
      };
    });

    /* ---- الأتمتة: موضوع ← قالب الفئة ← قالب المزج ---- */
    var autos = [];
    topics.forEach(function (t) { pushUnique(autos, t.automation(f), autoKey); });
    book.autos.forEach(function (fn) { pushUnique(autos, fn(f), autoKey); });
    if (blendBook) blendBook.autos.forEach(function (fn) { pushUnique(autos, fn(f), autoKey); });
    autos = autos.slice(0, 3);

    /* ---- المؤشرات: مؤشرات الوحدة + مؤشر أثر خاص بالفعالية ---- */
    var kpis = book.kpis(f).slice(0, 2);
    kpis.push({
      name_ar: 'نسبة الهدر في الفعاليات من نمط ' + f.nameType,
      target_ar: '≤ ' + L.WASTE_TARGET_PCT + '% (المسجَّل في ' + f.nameQ + ': ' + f.wastePct + '%)'
    });

    var diagnosis = buildDiagnosis({
      ev: ev, f: f, cls: cls, pattern: pattern,
      spofTarget: spofTarget(ev),
      worked: whatWorked(ev),
      failedShort: ev.receiving_intake_issue && !/سليم/.test(ev.receiving_intake_issue)
        ? ev.receiving_intake_issue
        : (ev.supply_chain_issue && !/سليم/.test(ev.supply_chain_issue) ? ev.supply_chain_issue : ev.root_cause)
    });

    return {
      status: 'generated',
      portal_module: moduleName,
      diagnosis_ar: diagnosis,
      recommendations: recs,
      automations: autos,
      kpis: kpis
    };
  }

  /* ================================================================== *
   * أثر التنفيذ — يُحسب حياً للعرض، ولا يُحفظ داخل الحل (حفاظاً على المخطط)
   * ================================================================== */
  function explain(ev, goldenEvents) {
    var cls = classify(ev);
    var pattern = detectPattern(ev, cls);
    var severity = assessSeverity(ev);
    var templates = pickTemplates(ev, cls, pattern, goldenEvents || []);
    var blendKey = templates.blend ? templates.blend.profile.category : null;
    var topics = matchTopics(ev, cls.primary.key, blendKey);
    return {
      classification: cls,
      pattern: pattern,
      severity: severity,
      templates: templates,
      topics: topics.map(function (t) { return t.key; }),
      module: L.MODULE_FOR_CATEGORY[cls.primary.key],
      facts: facts(ev)
    };
  }

  global.RuleEngine = {
    classify: classify,
    detectPattern: detectPattern,
    assessSeverity: assessSeverity,
    pickTemplates: pickTemplates,
    facts: facts,
    generate: generate,
    explain: explain,
    TOPIC_RULES: TOPIC_RULES,
    PLAYBOOKS: PLAYBOOKS
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* eslint-disable */
/**
 * assets/store.js — مصدر الحقيقة القابل للتعديل
 * ==============================================
 * تُنسخ البذرة المدمجة (window.PORTAL_SEED) إلى localStorage عند أول تشغيل،
 * ثم تصبح نسخة localStorage هي المرجع لكل الشاشات. لا شبكة، لا باك-إند.
 */
(function (global) {
  'use strict';

  var KEY = 'portal.catering.dataset.v1';
  var state = null;
  var listeners = [];

  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

  function storageAvailable() {
    try {
      var k = '__portal_probe__';
      global.localStorage.setItem(k, '1');
      global.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  var HAS_STORAGE = storageAvailable();

  /* ---------------- التحقق من صحة مجموعة بيانات مستوردة ---------------- */
  function validateDataset(obj) {
    var errors = [];
    if (!obj || typeof obj !== 'object') { errors.push('الملف ليس كائن JSON صالحاً.'); return errors; }
    if (!Array.isArray(obj.events)) { errors.push('الملف لا يحتوي على مصفوفة events.'); return errors; }
    obj.events.forEach(function (ev, i) {
      var at = 'الفعالية رقم ' + (i + 1) + (ev && ev.event_id ? ' (' + ev.event_id + ')' : '');
      if (!ev || typeof ev !== 'object') { errors.push(at + ': ليست كائناً.'); return; }
      if (!ev.event_id) errors.push(at + ': ينقصها event_id.');
      if (!ev.event_name) errors.push(at + ': ينقصها event_name.');
      if (!ev.food_kg || typeof ev.food_kg !== 'object') errors.push(at + ': ينقصها كائن food_kg.');
      else if (Number(ev.food_kg.wasted) > Number(ev.food_kg.delivered))
        errors.push(at + ': الكمية المتلفة أكبر من المورّدة.');
    });
    var ids = obj.events.map(function (e) { return e && e.event_id; });
    ids.forEach(function (id, i) {
      if (id && ids.indexOf(id) !== i) errors.push('معرّف مكرر: ' + id);
    });
    return errors;
  }

  /* ---------------- التحميل والحفظ ---------------- */
  function load() {
    if (state) return state;
    if (HAS_STORAGE) {
      try {
        var raw = global.localStorage.getItem(KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (!validateDataset(parsed).length) { state = parsed; return state; }
        }
      } catch (e) { /* بيانات تالفة — نعود للبذرة */ }
    }
    state = deepClone(global.PORTAL_SEED);
    persist();
    return state;
  }

  function persist() {
    if (!HAS_STORAGE || !state) return false;
    try {
      state.events_count = state.events.length;
      state.golden_examples = state.events
        .filter(function (e) { return e.golden_solution && e.golden_solution.status === 'golden_approved'; })
        .map(function (e) { return e.event_id; });
      global.localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (e) { return false; }
  }

  function emit() {
    listeners.forEach(function (fn) { try { fn(state); } catch (e) { console.error(e); } });
  }

  function commit() { persist(); emit(); }

  /* ---------------- واجهة القراءة ---------------- */
  function all() { return load().events; }
  function dataset() { return load(); }
  function byId(id) {
    return all().filter(function (e) { return e.event_id === id; })[0] || null;
  }
  function goldenEvents() {
    return all().filter(function (e) {
      return e.golden_solution && e.golden_solution.status === 'golden_approved';
    });
  }

  /** أصغر معرّف متاح بصيغة EV-XXX */
  function nextId() {
    var max = 0;
    all().forEach(function (e) {
      var m = /^EV-(\d+)$/.exec(e.event_id || '');
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return 'EV-' + String(max + 1).padStart(3, '0');
  }

  /* ---------------- واجهة الكتابة ---------------- */
  function addEvent(ev) {
    load();
    state.events.push(ev);
    commit();
    return ev;
  }

  function updateEvent(id, patch) {
    load();
    var ev = byId(id);
    if (!ev) return null;
    Object.keys(patch).forEach(function (k) { ev[k] = patch[k]; });
    commit();
    return ev;
  }

  function setSolution(id, solution) {
    return updateEvent(id, { golden_solution: solution });
  }

  function deleteEvent(id) {
    load();
    var i = state.events.findIndex(function (e) { return e.event_id === id; });
    if (i === -1) return false;
    state.events.splice(i, 1);
    commit();
    return true;
  }

  function reset() {
    state = deepClone(global.PORTAL_SEED);
    commit();
    return state;
  }

  /* ---------------- التصدير والاستيراد ---------------- */
  function exportJson() {
    var d = deepClone(load());
    d.events_count = d.events.length;
    d.golden_examples = d.events
      .filter(function (e) { return e.golden_solution && e.golden_solution.status === 'golden_approved'; })
      .map(function (e) { return e.event_id; });
    return JSON.stringify(d, null, 2);
  }

  /**
   * mode = 'replace' يستبدل المجموعة كاملة
   * mode = 'merge'   يضيف الجديد ويحدّث المتطابق بالمعرّف
   */
  function importJson(obj, mode) {
    var errors = validateDataset(obj);
    if (errors.length) return { ok: false, errors: errors };

    load();
    if (mode === 'replace') {
      state = deepClone(obj);
    } else {
      var added = 0, updated = 0;
      obj.events.forEach(function (incoming) {
        var existing = byId(incoming.event_id);
        if (existing) {
          Object.keys(incoming).forEach(function (k) { existing[k] = deepClone(incoming[k]); });
          updated++;
        } else {
          state.events.push(deepClone(incoming));
          added++;
        }
      });
      commit();
      return { ok: true, added: added, updated: updated, total: state.events.length };
    }
    commit();
    return { ok: true, added: state.events.length, updated: 0, total: state.events.length };
  }

  function subscribe(fn) {
    listeners.push(fn);
    return function () { listeners = listeners.filter(function (f) { return f !== fn; }); };
  }

  global.Store = {
    KEY: KEY,
    HAS_STORAGE: HAS_STORAGE,
    all: all,
    dataset: dataset,
    byId: byId,
    goldenEvents: goldenEvents,
    nextId: nextId,
    addEvent: addEvent,
    updateEvent: updateEvent,
    setSolution: setSolution,
    deleteEvent: deleteEvent,
    reset: reset,
    exportJson: exportJson,
    importJson: importJson,
    validateDataset: validateDataset,
    subscribe: subscribe
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* eslint-disable */
/**
 * assets/charts.js — رسوم SVG مرسومة يدوياً (بلا أي مكتبة أو شبكة)
 * ================================================================
 * كل رسم يُنتج نص SVG متجاوباً (viewBox) ويحترم اتجاه RTL.
 */
(function (global) {
  'use strict';

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US');
  }

  /** اختيار خطوة مقياس مريحة (1/2/5 × 10^n) */
  function niceStep(max, ticks) {
    var raw = max / (ticks || 4);
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var norm = raw / mag;
    var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return step * mag;
  }

  /**
   * أعمدة أفقية — الأنسب للتسميات العربية الطويلة (فئات، إمارات، مزودون).
   * التخطيط (RTL): عمود التسميات على اليمين، الأعمدة تنمو من اليمين لليسار،
   * والقيمة الرقمية خارج طرف العمود. كل النصوص direction="rtl" فيكون

    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));

    var labelW = 39;         // عمود التسميات على اليمين
    var valueW = 8;          // مساحة محجوزة لأرقام القيم على اليسار
    var barRight = W - labelW;
    var barW = barRight - valueW;

    var parts = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H.toFixed(1) +
                 '" role="img" aria-label="' + esc(opts.title || 'رسم أعمدة') + '">'];

    rows.forEach(function (r, i) {
      var y = padTop + i * (rowH + gap);
      var baseline = y + rowH * 0.7;
      var w = max > 0 ? (r.value / max) * barW : 0;
      if (r.value > 0 && w < 0.7) w = 0.7;
      var tip = barRight - w;
      var clickable = !!r.filter;

      // مجموعة واحدة لكل صف: تسمية + مسار + عمود + قيمة، ومنطقة نقر تغطيها
      parts.push('<g class="ch-row' + (clickable ? ' is-clickable' : '') + '"' +
                 (clickable ? ' data-chart-filter="' + esc(JSON.stringify(r.filter)) +
                              '" role="button" tabindex="0"' : '') + '>');

      if (clickable) {
        parts.push('<rect class="ch-hit" x="0" y="' + (y - gap / 2).toFixed(2) +
                   '" width="' + W + '" height="' + (rowH + gap).toFixed(2) + '" rx="1.6"/>');
      }

      var label = r.sub ? r.label + ' • ' + r.sub : r.label;
      parts.push('<text class="ch-label" direction="rtl" text-anchor="start" x="' + (W - 0.6) +
                 '" y="' + baseline.toFixed(2) + '">' + esc(label) + '</text>');

      parts.push('<rect class="ch-track" x="' + valueW + '" y="' + y.toFixed(2) + '" width="' + barW +
                 '" height="' + rowH + '" rx="1.2"/>');
      parts.push('<rect class="ch-bar" x="' + tip.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) +
                 '" height="' + rowH + '" rx="1.2" fill="' + (r.color || '#1c3557') + '"/>');

      parts.push('<text class="ch-value" direction="rtl" text-anchor="start" x="' + (tip - 1).toFixed(2) +
                 '" y="' + baseline.toFixed(2) + '">' + esc(fmt(r.value)) + '</text>');

      parts.push('<title>' + esc(r.label + ': ' + fmt(r.value) + ' ' + unit +
                 (clickable ? ' — انقر للتصفية' : '')) + '</title>');
      parts.push('</g>');

    parts.push('</svg>');
    return parts.join('');

  var MONTHS_SHORT = ['ينا', 'فبر', 'مار', 'أبر', 'مايو', 'يون',

  /**
   * أعمدة رأسية زمنية مع خط اتجاه — تُقرأ من اليمين (الأقدم) إلى اليسار.
   * points: [{ label, value, color }]

  function timeSeries(points, opts) {
    opts = opts || {};
    var W = 100, H = 42, padB = 7, padT = 3, padR = 10, padL = 1.5;
    var n = Math.max(points.length, 1);
    var innerW = W - padL - padR;

    var barW = Math.min(slot * 0.5, 5);
    var max = Math.max.apply(null, points.map(function (p) { return p.value; }).concat([1]));
    var step = niceStep(max, 3);
    var top = Math.ceil(max / step) * step || 1;

    var parts = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H +
                 '" role="img" aria-label="' + esc(opts.title || 'سلسلة زمنية') + '">'];

                 '" x2="' + (W - padR) + '" y2="' + gy.toFixed(2) + '"/>');
      parts.push('<text class="ch-axis" direction="rtl" text-anchor="start" x="' + (W - 0.6) +
                 '" y="' + (gy + 0.9).toFixed(2) + '">' + esc(fmt(v)) + '</text>');
    }

    var labelStep = Math.max(1, Math.ceil(4.8 / slot));
    var line = [];

    points.forEach(function (p, i) {
      var cx = W - padR - (i + 0.5) * slot;   // الأقدم يميناً
      var h = (p.value / top) * plotH;
      var y = padT + plotH - h;
      var clickable = !!p.filter;

      parts.push('<g class="ch-row' + (clickable ? ' is-clickable' : '') + '"' +
                 (clickable ? ' data-chart-filter="' + esc(JSON.stringify(p.filter)) +
                              '" role="button" tabindex="0"' : '') + '>');
      if (clickable) {
        parts.push('<rect class="ch-hit" x="' + (cx - slot / 2).toFixed(2) + '" y="' + padT +
                   '" width="' + slot.toFixed(2) + '" height="' + (plotH + padB - 1).toFixed(2) + '" rx="1"/>');
      }
      parts.push('<rect class="ch-bar" x="' + (cx - barW / 2).toFixed(2) + '" y="' + y.toFixed(2) +
                 '" width="' + barW.toFixed(2) + '" height="' + Math.max(h, 0.25).toFixed(2) +
                 '" rx="0.7" fill="' + (p.color || '#1c3557') + '"/>');
      parts.push('<title>' + esc(p.label + ': ' + fmt(p.value) + ' ' + (opts.unit || '') +
                 (clickable ? ' — انقر للتصفية' : '')) + '</title>');
      parts.push('</g>');

      if (i % labelStep === 0) {
        parts.push('<text class="ch-axis" direction="rtl" text-anchor="middle" x="' + cx.toFixed(2) +
                   '" y="' + (H - 1.6) + '">' + esc(p.short || p.label) + '</text>');
      }
      line.push(cx.toFixed(2) + ',' + y.toFixed(2));
    });

    if (points.length > 1 && opts.trend !== false) {
      parts.push('<polyline class="ch-trend" points="' + line.join(' ') + '"/>');
      line.forEach(function (pt) {
        var xy = pt.split(',');
        parts.push('<circle class="ch-dot" cx="' + xy[0] + '" cy="' + xy[1] + '" r="0.7"/>');
      });
    }

    parts.push('</svg>');
    return parts.join('');
  }

  /** حلقة توزيع الخطورة */
  function donut(slices, opts) {
    opts = opts || {};
    var total = slices.reduce(function (a, s) { return a + s.value; }, 0);
    var R = 40, r = 25, cx = 50, cy = 50;
    var parts = ['<svg class="chart chart-donut" viewBox="0 0 100 100" role="img" aria-label="' +
                 esc(opts.title || 'توزيع') + '">'];

    if (total === 0) {
      parts.push('<circle cx="50" cy="50" r="' + ((R + r) / 2) + '" fill="none" stroke="#e2e8f0" stroke-width="' +
                 (R - r) + '"/></svg>');
      return parts.join('');
    }

    var angle = -Math.PI / 2;
    slices.forEach(function (s) {
      if (s.value <= 0) return;
      var sweep = (s.value / total) * Math.PI * 2;
      var a0 = angle, a1 = angle + sweep;
      angle = a1;
      var large = sweep > Math.PI ? 1 : 0;

        'M', (cx + R * Math.cos(a0)).toFixed(2), (cy + R * Math.sin(a0)).toFixed(2),
        'A', R, R, 0, large, 1, (cx + R * Math.cos(a1)).toFixed(2), (cy + R * Math.sin(a1)).toFixed(2),
        'L', (cx + r * Math.cos(a1)).toFixed(2), (cy + r * Math.sin(a1)).toFixed(2),
        'A', r, r, 0, large, 0, (cx + r * Math.cos(a0)).toFixed(2), (cy + r * Math.sin(a0)).toFixed(2),
        'Z'
      ].join(' ');
      var clickable = !!s.filter;
      parts.push('<g class="ch-row' + (clickable ? ' is-clickable' : '') + '"' +
                 (clickable ? ' data-chart-filter="' + esc(JSON.stringify(s.filter)) +

      parts.push('<path class="ch-slice" d="' + p + '" fill="' + s.color + '"/>');
      parts.push('<title>' + esc(s.label + ': ' + fmt(s.value) +
                 (clickable ? ' — انقر للتصفية' : '')) + '</title>');

    });

    parts.push('<text class="ch-center-num" x="50" y="49" text-anchor="middle">' + esc(fmt(total)) + '</text>');
    parts.push('<text class="ch-center-lbl" x="50" y="59" text-anchor="middle">' + esc(opts.centerLabel || 'حادثة') + '</text>');
    parts.push('</svg>');
    return parts.join('');
  }

  global.Charts = { barsH: barsH, timeSeries: timeSeries, donut: donut,
                    fmt: fmt, esc: esc, MONTHS_SHORT: MONTHS_SHORT };
})(typeof window !== 'undefined' ? window : globalThis);

 * assets/xlsx.js — قراءة وكتابة ملفات Excel داخل المتصفح، بلا أي مكتبة وبلا API
 * =============================================================================
 * ملف .xlsx هو أرشيف ZIP يحوي ملفات XML. لذلك نحتاج شيئين فقط:
