[project]
name = "aigency-crew"
version = "0.1.0"
description = "Six-agent CrewAI growth engine for The Aigency: funding research, client pipeline, and outreach campaigns — each with a paired auditor and a bounded feedback loop."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

dependencies = [
    # The anthropic extra pulls the native provider CrewAI needs for
    # anthropic/* model strings; without it LLM() raises at construction.
    "crewai[anthropic]>=1.15.0",
    "pydantic>=2.11.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
tools = ["crewai-tools>=1.0.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
aigency-crew = "aigency_crew.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigency_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
