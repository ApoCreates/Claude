[project]
name = "localbird"
version = "1.0.0"
description = "A fully-local, unlimited desktop context assistant (screen memory, meetings, chat, journals, routines)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.26"]
macos = [
    "pyobjc-framework-Cocoa>=10; sys_platform=='darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform=='darwin'",
    "rumps>=0.4; sys_platform=='darwin'",
]

[project.scripts]
localbird = "localbird.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["localbird", "localbird.capture"]
